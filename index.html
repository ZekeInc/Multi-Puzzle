<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A simple Sudoku game with no ads.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <title>Sudoku</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Sudoku</h1>
      <div class="status">
        <span id="mistakes">Mistakes: 0</span>
        <span id="timer">00:00</span>
      </div>
    </header>

    <div class="top-controls">
      <select id="difficulty" aria-label="Difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-game">New</button>
      <button id="check">Check</button>
      <button id="solve">Solve</button>
    </div>

    <div class="board-wrap">
      <div id="board" role="grid" aria-label="Sudoku board"></div>
    </div>

    <p id="message" role="status"></p>

    <div class="actions">
      <button id="undo" aria-label="Undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span>Undo</span>
      </button>
      <button id="erase" aria-label="Erase">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H8l-5-5 10-10 8 8-6 6"/><path d="m7 9 8 8"/></svg>
        <span>Erase</span>
      </button>
      <button id="notes-toggle" aria-label="Notes" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Notes <b id="notes-state">off</b></span>
      </button>
      <button id="hint" aria-label="Hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2Z"/></svg>
        <span>Hint</span>
      </button>
    </div>

    <div class="numpad" id="numpad"></div>
  </main>

  <script src="sudoku.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
